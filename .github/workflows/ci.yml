name: ci

on:
  push:
    branches: ["master", "feature/**"]
  pull_request:
    branches: ["master"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore src/IncidentAgent.Api/IncidentAgent.Api.csproj

      - name: Build API
        run: dotnet build src/IncidentAgent.Api/IncidentAgent.Api.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/IncidentAgent.Tests/IncidentAgent.Tests.csproj -c Release
