services:
  incident-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      Evidence__GitHub__Enabled: ${GITHUB_EVIDENCE_ENABLED:-false}
      Evidence__GitHub__Owner: ${GITHUB_EVIDENCE_OWNER:-}
      Evidence__GitHub__Repository: ${GITHUB_EVIDENCE_REPOSITORY:-}
      Evidence__GitHub__Token: ${GITHUB_TOKEN:-}

      Evidence__Loki__Enabled: ${LOKI_EVIDENCE_ENABLED:-false}
      Evidence__Loki__BaseUrl: ${LOKI_BASE_URL:-http://host.docker.internal:3100/}
      Evidence__Loki__BearerToken: ${LOKI_BEARER_TOKEN:-}
      Evidence__Loki__TenantId: ${LOKI_TENANT_ID:-}

      Evidence__Tempo__Enabled: ${TEMPO_EVIDENCE_ENABLED:-false}
      Evidence__Tempo__BaseUrl: ${TEMPO_BASE_URL:-http://host.docker.internal:3200/}
      Evidence__Tempo__BearerToken: ${TEMPO_BEARER_TOKEN:-}
      Evidence__Tempo__TenantId: ${TEMPO_TENANT_ID:-}

      Evidence__Prometheus__Enabled: ${PROMETHEUS_EVIDENCE_ENABLED:-false}
      Evidence__Prometheus__BaseUrl: ${PROMETHEUS_BASE_URL:-http://host.docker.internal:9090/}
      Evidence__Prometheus__BearerToken: ${PROMETHEUS_BEARER_TOKEN:-}

      Evidence__Kubernetes__Enabled: ${KUBERNETES_EVIDENCE_ENABLED:-false}
      Evidence__Kubernetes__BaseUrl: ${KUBERNETES_BASE_URL:-https://kubernetes.default.svc/}
      Evidence__Kubernetes__Namespace: ${KUBERNETES_NAMESPACE:-default}
      Evidence__Kubernetes__BearerToken: ${KUBERNETES_BEARER_TOKEN:-}
      Evidence__Kubernetes__TokenFile: ${KUBERNETES_TOKEN_FILE:-/var/run/secrets/kubernetes.io/serviceaccount/token}

      Reasoning__Llm__Enabled: ${LLM_REASONING_ENABLED:-false}
      Reasoning__Llm__Provider: ${LLM_PROVIDER:-openai}
      Reasoning__Llm__Model: ${LLM_MODEL:-gpt-5}
      Reasoning__Llm__ApiKey: ${LLM_API_KEY:-}
      Reasoning__Llm__OpenAiBaseUrl: ${LLM_OPENAI_BASE_URL:-https://api.openai.com/}
      Reasoning__Llm__AnthropicBaseUrl: ${LLM_ANTHROPIC_BASE_URL:-https://api.anthropic.com/}
      Reasoning__Llm__InputCostPerMillionTokens: ${LLM_INPUT_COST_PER_MILLION:-0}
      Reasoning__Llm__OutputCostPerMillionTokens: ${LLM_OUTPUT_COST_PER_MILLION:-0}

      Persistence__Enabled: ${PERSISTENCE_ENABLED:-true}
      Persistence__ConnectionString: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=incident_agent;Username=incident_agent;Password=incident_agent}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_agent}
      POSTGRES_USER: ${POSTGRES_USER:-incident_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_agent}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_agent} -d ${POSTGRES_DB:-incident_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - incident-agent-postgres:/var/lib/postgresql/data

volumes:
  incident-agent-postgres:
